# the default settings for the partitioned STM generation, running in the generate_partitioned_stm job

generate_partitioned_stm:
  general:
    AoI-name: "**AoI_name**"
    directory: '/project/caroline/Share/stms_zarr'
    partition: 'normal'
    depsi_group-code-directory: '**CAROLINE_PLUGINS_DIRECTORY**/DePSI_group'

  generate_partitioned_stm-settings:

    ps-selection:
      mode: 'full'  # initialization / full
      init-settings:  # settings for initialization mode, ignored if mode is full
        start-date: '2013-03-01'
        init-length: 50

      method: "nmad" # nmad / nad
      threshold: 0.35

    incremental-statistics:
      increment-mode: "incremental"  # incremental (every epoch) / recalibration (every jump-size epochs)
      recal-jump-size: 10

    single-differences:
      mother: "auto" # YYYY-MM-DD or auto, latter uses already existing mother

    extra-projection: 'RD'  # '' for no new projection, accepts all EPSG codes and RD for the Dutch Rijksdriehoek

    partitioning:
      do-partitioning: 1
      search-method: 'pelt'
      cost-function: 'l2'
      db-mode: 0
      min-partition-length: 27
      undifferenced-output-lyrs: ['nmad', 'nad', 'quality_nmad_2sigma']
      single-difference-output-lyrs: ['mad', 'amplitude_sigma', 'amplitude_mean', 'amplitude_median']

    outlier-detection:
      do-outlier-detection: 1
      window-size: 15
      db-mode: 1
      n-sigma: 3  # number of sigma before something is considered an outlier
