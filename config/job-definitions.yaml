# job-definitions.yaml
# defines all necessary parameters for the scheduler to schedule the jobs
# a list requirement will be a dependency of all that run
# Leave empty for a None value
# The order of the jobs in this file is the order in which they will appear in the email

jobs:
  s1_download:
    requirement:
    two-letter-id: "SD"
    parameter-file-step-key: "general:steps:do-s1_download"
    partition: "normal"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: "S1"

  snap_preparation:
    requirement: "s1_download"
    two-letter-id: "SP"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "normal"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8"
    directory-contents-file-appendix: "_prep"
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "generate-snap-graphs.sh"
      bash-file-base-directory: "snap"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: "S1"
        workflow:
          filters:
            coregistration-mode: "snap"

  snap:
    requirement: "snap_preparation"
    two-letter-id: "SN"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "normal"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --constraint=rome"
    directory-contents-file-appendix: "_run"
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "run-snap-graph.sh"
      bash-file-base-directory: "snap"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: True
      njobs-in-array-function: "njobs_snap"
    filters:
      general:
        input-data:
          sensor: "S1"
        workflow:
          filters:
            coregistration-mode: "snap"

  snap_fix_permissions:
    requirement: "snap"
    two-letter-id: "SF"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "short"
    sbatch-args: "--ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: "_permissions"
    email:
      include-in-email: False
      status-file-search-key:
    bash-file:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: "S1"
        workflow:
          filters:
            coregistration-mode: "snap"

  doris_v5:
    requirement: "s1_download"
    two-letter-id: "D5"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "doris_v5:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --mem-per-cpu=8000"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key: "profile_log*"
    bash-file:
      bash-file-name: "doris_stack.sh"
      bash-file-base-directory: "doris_v5"  # expects doris_v5:general:AoI-name and doris_v5:general:directory
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: "S1"
        workflow:
          filters:
            coregistration-mode: "doris"

  doris_v4:
    requirement:
    two-letter-id: "D4"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "doris_v4:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --mem-per-cpu=8000"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "run_doris_v4.sh"
      bash-file-base-directory: "doris_v4"  # expects doris_v4:general:AoI-name and doris_v4:general:directory
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: ["ERS", "ENV", "TSX", "TDX", "PAZ", "RSAT2", "Cosmo", "ALOS2"]

  doris_v5_cleanup:
    requirement: "doris_v5"
    two-letter-id: "DC"
    parameter-file-step-key: "general:steps:do-coregistration"
    partition: "short"
    sbatch-args: "--ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: False
      status-file-search-key:
    bash-file:
      bash-file-name: "cleanup.sh"
      bash-file-base-directory: "doris"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        input-data:
          sensor: "S1"
        workflow:
          filters:
            coregistration-mode: "doris"

  reduce_slc_matlab:
    requirement: ["doris_v5", "doris_v4"]
    two-letter-id: "RM"
    parameter-file-step-key: "general:steps:do-reduce_slc_matlab"
    partition: "reduce_slc_matlab:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "reduce-slc-matlab.sh"
      bash-file-base-directory: "reduce_slc_matlab"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            coregistration-mode: "doris"

  merge_to_stack_matlab:
    requirement: "snap_fix_permissions"
    two-letter-id: "MM"
    parameter-file-step-key: "general:steps:do-merge_to_stack_matlab"
    partition: "merge_to_stack_matlab:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --nodes=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "merge-to-stack-matlab.sh"
      bash-file-base-directory: "merge_to_stack_matlab"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
        slurm-cluster-n-workers: 4
        slurm-cluster-worker-time: "1-00:00:00"
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            coregistration-mode: "snap"

  merge_to_stack_python:
    requirement: "snap_fix_permissions"
    two-letter-id: "MP"
    parameter-file-step-key: "general:steps:do-merge_to_stack_python"
    partition: "merge_to_stack_python:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --nodes=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "merge-to-stack-python.sh"
      bash-file-base-directory: "merge_to_stack_python"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
        slurm-cluster-n-workers: 4
        slurm-cluster-worker-time: "1-00:00:00"
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            coregistration-mode: "snap"

  reduce_slc_python:
    requirement: ["doris_v5", "doris_v4"]
    two-letter-id: "RP"
    parameter-file-step-key: "general:steps:do-reduce_slc_python"
    partition: "reduce_slc_python:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --nodes=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "reduce-slc-python.sh"
      bash-file-base-directory: "reduce_slc_python"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
        slurm-cluster-n-workers: 12
        slurm-cluster-worker-time: "10:00:00"
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            coregistration-mode: "doris"

  stm_generation:
    requirement: ["reduce_slc_python", "merge_to_stack_python"]
    two-letter-id: "SG"
    parameter-file-step-key: "general:steps:do-stm_generation"
    partition: "stm_generation:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --nodes=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "generate-stm.sh"
      bash-file-base-directory: "stm_generation"
      bash-file-directory-appendix: ""
      bash-file-directory-is-reusable: True
      bash-file-slurm-cluster:
        slurm-cluster-n-workers: 10
        slurm-cluster-worker-time: "4-00:00:00"
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:

  depsi:
    requirement: ["reduce_slc_matlab", "merge_to_stack_matlab"]
    two-letter-id: "DE"
    parameter-file-step-key: "general:steps:do-depsi"
    partition: "depsi:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --mem-per-cpu=8000"
    directory-contents-file-appendix: ""
    email:
      include-in-email: True
      status-file-search-key: "*resfile.txt"
    bash-file:
      bash-file-name: "depsi.sh"
      bash-file-base-directory: "depsi"
      bash-file-directory-appendix: "/psi"
      bash-file-directory-is-reusable: False
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:

  mrm:
    requirement: "depsi"
    two-letter-id: "MR"
    parameter-file-step-key: "general:steps:do-depsi_post"
    partition: "normal"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=4 --mem-per-cpu=8000"
    directory-contents-file-appendix: "_mrm"
    email:
      include-in-email: False
      status-file-search-key:
    bash-file:
      bash-file-name: "read_mrm.sh"
      bash-file-base-directory: "depsi"
      bash-file-directory-appendix: "/psi"
      bash-file-directory-is-reusable: False
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:

  depsi_post:
    requirement: "mrm"
    two-letter-id: "DP"
    parameter-file-step-key: "general:steps:do-depsi_post"
    partition: "depsi_post:general:partition"
    sbatch-args: "--qos=long --ntasks=1 --cpus-per-task=8 --mem-per-cpu=8000"
    directory-contents-file-appendix: "_depsi_post"
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
      bash-file-name: "depsi_post.sh"
      bash-file-base-directory: "depsi"
      bash-file-directory-appendix: "/psi"
      bash-file-directory-is-reusable: False
      bash-file-slurm-cluster:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:

  tarball:
    requirement: "depsi_post"
    two-letter-id: "TB"
    parameter-file-step-key: "general:steps:do-depsi_post"
    partition: "short"
    sbatch-args: "--ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: "_tarball"
    email:
      include-in-email: False
      status-file-search-key:
    bash-file:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            depsi_post-output: "tarball"

  portal_upload:
    requirement: "depsi_post"
    two-letter-id: "PU"
    parameter-file-step-key: "general:steps:do-depsi_post"
    partition: "short"
    sbatch-args: "--ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: "_portalupload"
    email:
      include-in-email: True
      status-file-search-key:
    bash-file:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
      general:
        workflow:
          filters:
            depsi_post-output: "csv"

  email:
    requirement: "*"  # unique use case: this one should wait for every job except itself and is thus handled individually
    two-letter-id: "EM"
    parameter-file-step-key:
    partition: "short"
    sbatch-args: "--ntasks=1 --cpus-per-task=1"
    directory-contents-file-appendix: ""
    email:
      include-in-email: False
      status-file-search-key:
    bash-file:
    job-array:
      run-as-array: False
      njobs-in-array-function:
    filters:
